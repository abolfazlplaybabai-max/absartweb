{% load static %}
<link rel="stylesheet" href="{% static 'css/background.css' %}?v=1">
<link rel="stylesheet" href="{% static 'css/abs-art.css' %}?v=3">
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>
        {% block title %}ABS ART{% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #05080d;
            color: #f2f5f8;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        .site-header {
            position: relative;
            z-index: 1000;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #111c2b;
            background: rgba(5, 8, 13, 0.94);
            backdrop-filter: blur(12px);
        }

        .site-brand {
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .menu-button {
            width: 44px;
            height: 44px;
            border: 1px solid #17243a;
            border-radius: 10px;
            background: #0a101a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }

        .menu-button span {
            width: 20px;
            height: 2px;
            background: #dce5f2;
            border-radius: 5px;
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.65);
            opacity: 0;
            visibility: hidden;
            transition: .25s ease;
        }

        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: absolute;
            top: 0;
            right: 0;
            width: min(340px, 88vw);
            height: 100%;
            padding: 25px 18px;
            background: #07101c;
            border-left: 1px solid #17243a;
            transform: translateX(100%);
            transition: .28s ease;
            overflow-y: auto;
        }

        .menu-overlay.open .side-menu {
            transform: translateX(0);
        }

        .menu-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .menu-head strong {
            font-size: 18px;
            letter-spacing: 1px;
        }

        .menu-close {
            width: 38px;
            height: 38px;
            border: 1px solid #17243a;
            border-radius: 9px;
            background: #0b1422;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .menu-links a {
            display: block;
            text-decoration: none;
            padding: 14px 13px;
            border-radius: 10px;
            color: #dce5f2;
            border: 1px solid transparent;
            transition: .2s ease;
            font-size: 14px;
        }

        .menu-links a:hover {
            background: #0d1929;
            border-color: #1a2b44;
        }

        .site-main {
            min-height: calc(100vh - 112px);
        }

        .site-footer {
            text-align: center;
            padding: 22px 10px 16px;
            color: #4d5b6e;
            font-size: 9px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            .site-header {
                height: 62px;
                padding: 0 13px;
            }

            .site-brand {
                font-size: 15px;
            }

            .menu-button {
                width: 42px;
                height: 42px;
            }
        }

    </style>

    {% block extra_head %}{% endblock %}

</head>

<body>

<div class="abs-bg" aria-hidden="true">
    <div class="abs-grid"></div>

    <div class="abs-orb one"></div>
    <div class="abs-orb two"></div>
    <div class="abs-orb three"></div>

    <div class="abs-particle p1"></div>
    <div class="abs-particle p2"></div>
    <div class="abs-particle p3"></div>
    <div class="abs-particle p4"></div>
    <div class="abs-particle p5"></div>
</div>

<div class="abs-light" aria-hidden="true"></div>


    <header class="site-header">

        <a
            href="{% url 'home' %}"
            class="site-brand"
        >
            ABS ART
        </a>

        <button
            type="button"
            class="menu-button"
            id="menuOpen"
            aria-label="باز کردن منو"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>


    <div
        class="menu-overlay"
        id="menuOverlay"
    >

        <aside class="side-menu">

            <div class="menu-head">

                <strong>
                    ABS ART
                </strong>

                <button
                    type="button"
                    class="menu-close"
                    id="menuClose"
                    aria-label="بستن منو"
                >
                    ×
                </button>

            </div>


            <nav class="menu-links">

                <a href="{% url 'home' %}">
                    خانه
                </a>

                <a href="{% url 'folder_list' %}">
                    پوشه طرح‌ها
                </a>

                <a href="{% url 'work_list' %}">
                    همه طرح‌ها
                </a>

                <a href="{% url 'showcase' %}">
                    ویترین منتخب
                </a>

                <a href="{% url 'search' %}">
                    جستجو
                </a>

                <a href="{% url 'im_abs_login' %}">
                    I'm ABS
                </a>

            </nav>

        </aside>

    </div>


    <main class="site-main">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="site-footer">
        ABS ART
    </footer>


    <script>

        const menuOpen =
            document.getElementById("menuOpen");

        const menuClose =
            document.getElementById("menuClose");

        const menuOverlay =
            document.getElementById("menuOverlay");


        function openMenu() {

            menuOverlay.classList.add("open");

            document.body.style.overflow = "hidden";

        }


        function closeMenu() {

            menuOverlay.classList.remove("open");

            document.body.style.overflow = "";

        }


        menuOpen.addEventListener(
            "click",
            openMenu
        );


        menuClose.addEventListener(
            "click",
            closeMenu
        );


        menuOverlay.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === menuOverlay
                ) {
                    closeMenu();
                }

            }
        );


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {
                    closeMenu();
                }

            }
        );


        document.querySelectorAll(
            ".menu-links a"
        ).forEach(
            function(link) {

                link.addEventListener(
                    "click",
                    function() {
                        closeMenu();
                    }
                );

            }
        );

    </script>


    {% block extra_js %}
    {% endblock %}

<script src="{% static 'js/abs-art.js' %}?v=3"></script>
<script src="{% static 'js/background.js' %}?v=1"></script>
</body>

</html>
