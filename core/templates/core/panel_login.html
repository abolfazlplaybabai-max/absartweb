{% extends "base.html" %}

{% block title %}
ورود | ABS ART
{% endblock %}


{% block content %}

<style>

    .login-page {
        width: min(430px, 92%);
        min-height: calc(100vh - 150px);

        margin: auto;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-box {
        width: 100%;

        padding: 32px;

        background: #080d14;

        border: 1px solid rgba(22,133,255,.18);
        border-radius: 18px;

        box-shadow:
            0 20px 70px rgba(0,0,0,.35);
    }

    .login-brand {
        margin-bottom: 30px;
    }

    .login-brand h1 {
        margin: 0;

        color: #1685ff;

        font-family: Arial, sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 2px;
    }

    .login-brand p {
        margin: 9px 0 0;

        color: #718090;

        font-size: 12px;
    }

    .field {
        margin-bottom: 17px;
    }

    .field label {
        display: block;

        margin-bottom: 8px;

        color: #b9c2cc;

        font-size: 12px;
    }

    .field input {
        width: 100%;

        padding: 14px 15px;

        border: 1px solid rgba(255,255,255,.09);
        border-radius: 9px;

        outline: none;

        background: #05080d;
        color: #ffffff;

        font-family: inherit;
        font-size: 14px;

        transition:
            border-color .2s ease,
            box-shadow .2s ease;
    }

    .field input:focus {
        border-color: rgba(22,133,255,.7);

        box-shadow:
            0 0 0 3px rgba(22,133,255,.08);
    }

    .error {
        margin-bottom: 17px;

        padding: 12px 14px;

        background: rgba(255,60,60,.08);

        border: 1px solid rgba(255,60,60,.2);
        border-radius: 9px;

        color: #ff8585;

        font-size: 12px;
        line-height: 1.8;
    }

    .login-button {
        width: 100%;

        margin-top: 7px;

        padding: 14px;

        border: 0;
        border-radius: 9px;

        background: #1685ff;
        color: #ffffff;

        font-family: inherit;
        font-size: 14px;
        font-weight: 800;

        cursor: pointer;

        transition:
            background .2s ease,
            transform .2s ease;
    }

    .login-button:hover {
        background: #0878ef;
        transform: translateY(-1px);
    }

    @media (max-width: 430px) {

        .login-box {
            padding: 25px 20px;
            border-radius: 14px;
        }

    }

</style>


<div class="login-page">

    <div class="login-box">

        <div class="login-brand">

            <h1>
                ABS ART
            </h1>

            <p>
                ورود به پنل مدیریت
            </p>

        </div>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="field">

                <label for="username">
                    نام کاربری
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    رمز عبور
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                ورود
            </button>

        </form>

    </div>

</div>

{% endblock %}
