{% extends "core/base.html" %}

{% block title %}I'm ABS | ABS ART{% endblock %}

{% block content %}

<style>

.im-abs-secure {
    min-height: calc(100vh - 112px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    background:
        radial-gradient(
            circle at center,
            rgba(0, 71, 171, .18),
            transparent 48%
        ),
        #02060b;
}

.im-abs-secure-box {
    text-align: center;
}

.im-abs-secure-box h1 {
    margin: 0 0 12px;
    font-size: clamp(34px, 9vw, 62px);
    letter-spacing: 5px;
}

.im-abs-secure-box p {
    color: #118b52;
    font-size: 14px;
}

.im-abs-logout {
    display: inline-block;
    margin-top: 22px;
    padding: 11px 20px;
    border: 1px solid #19324f;
    border-radius: 9px;
    text-decoration: none;
    color: #b9c8da;
    font-size: 12px;
}

</style>


<section class="im-abs-secure">

    <div class="im-abs-secure-box">

        <h1>
            I'M ABS
        </h1>

        <p>
            دسترسی تأیید شد.
        </p>

        <a
            href="{% url 'im_abs_logout' %}"
            class="im-abs-logout"
        >
            خروج
        </a>

    </div>

</section>

{% endblock %}
